# Build the Vite/React portfolio and publish it to GitHub Pages.
#
# The previous version of this workflow uploaded the repository root verbatim,
# which suited the old hand-written static site. This app has to be compiled
# first, so we run the real build and publish only `dist/`.
#
# No secrets are needed: English→Arabic translation is generated ahead of time
# by `npm run translate` and committed as src/i18n/ar.json, so the build is
# fully offline. The Gemini chat assistant is the one feature that needs a
# server and therefore does not function on Pages.
name: Deploy site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify every English string has an Arabic translation
        run: npm run translate:check

      - name: Build
        # Pages serves this repo from /MyPortfolio/, not the domain root.
        env:
          VITE_BASE: /MyPortfolio/
        run: npm run build

      - name: Add SPA fallback
        # Pages has no server-side rewrite, so a hard refresh on /work/mymo2
        # would 404. Serving the app shell as 404.html lets the client router
        # pick the URL up instead.
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
